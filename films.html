<style>
  :root { --abyss: #02040A; --ocean: #060F1F; --depth: #0A1A35; --glow: #6BB4E8; --foam: #CFD9E4; --stone: #8B929C; --hair: #132341; --display: 'Fraunces', serif; --ui: 'Inter', sans-serif; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { scroll-behavior: smooth; overflow-x: clip; }
  body { background: var(--abyss); color: var(--foam); font-family: var(--ui); -webkit-font-smoothing: antialiased; }

  .nav { position: fixed; top: 0; left: 0; right: 0; z-index: 100; padding: 28px 48px; display: flex; justify-content: space-between; align-items: center; background: linear-gradient(to bottom, rgba(2,4,10,0.6), transparent); font-size: 10.5px; letter-spacing: .28em; text-transform: uppercase; }
  .nav .brand { display: inline-flex; flex-direction: column; gap: 3px; line-height: 1; color: var(--foam); text-decoration: none; }
  .nav .brand .line1 { font-weight: 600; letter-spacing: .32em; font-size: 11px; }
  .nav .brand .line2 { font-weight: 500; letter-spacing: .42em; font-size: 9px; color: var(--stone); }
  .nav .links a { color: var(--stone); text-decoration: none; margin-left: 28px; transition: color .5s; }
  .nav .links a:hover, .nav .links a.on { color: var(--foam); }

  .top { padding: 200px 48px 60px; max-width: 1200px; margin: 0 auto; }
  .top .eyebrow { font-size: 10.5px; letter-spacing: .5em; text-transform: uppercase; color: var(--glow); font-weight: 500; margin-bottom: 24px; }
  .top h1 { font-family: var(--display); font-weight: 200; font-size: clamp(52px, 9vw, 120px); letter-spacing: -0.03em; line-height: 0.95; color: var(--foam); }
  .top p { margin-top: 26px; font-family: var(--display); font-style: italic; font-size: clamp(17px, 1.8vw, 22px); color: var(--stone); max-width: 620px; line-height: 1.5; }

  .grid { max-width: 1200px; margin: 0 auto; padding: 40px 48px 140px; display: grid; grid-template-columns: 1fr 1fr; gap: 32px; }
  .film { position: relative; display: block; text-decoration: none; color: inherit; aspect-ratio: 3/4; border: 1px solid var(--hair); overflow: hidden; background: var(--depth); }
  .film .art { position: absolute; inset: 0; background-size: cover; background-position: center; transition: transform 1s cubic-bezier(.2,.7,.2,1); }
  .film:hover .art { transform: scale(1.05); }
  .film .glass { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; padding: 24px; }
  .film .glass img { max-width: 78%; max-height: 60%; object-fit: contain; filter: drop-shadow(0 16px 40px rgba(0,0,0,0.6)); }
  .film .veil { position: absolute; inset: 0; background: linear-gradient(to top, rgba(2,4,10,0.95) 0%, rgba(2,4,10,0.2) 45%, rgba(2,4,10,0.35) 100%); }
  .film .info { position: absolute; left: 0; right: 0; bottom: 0; padding: 34px 34px 38px; }
  .film .status { font-size: 9.5px; letter-spacing: .45em; text-transform: uppercase; color: var(--glow); font-weight: 600; margin-bottom: 12px; }
  .film .name { font-family: var(--display); font-weight: 300; font-size: clamp(30px, 3.4vw, 48px); letter-spacing: -0.02em; color: var(--foam); line-height: 1; }
  .film .sub { margin-top: 12px; font-size: 11px; letter-spacing: .32em; text-transform: uppercase; color: var(--stone); }
  .film .go { margin-top: 20px; font-size: 10px; letter-spacing: .4em; text-transform: uppercase; color: var(--foam); opacity: 0; transform: translateX(-6px); transition: opacity .5s, transform .5s; }
  .film:hover .go { opacity: 1; transform: none; }

  footer { padding: 80px 48px 48px; background: var(--abyss); color: var(--stone); border-top: 1px solid var(--hair); text-align: center; }
  footer .mark { color: var(--foam); font-size: 12px; letter-spacing: .35em; font-weight: 600; margin-bottom: 14px; }
  footer .links2 a { color: var(--stone); text-decoration: none; margin: 0 12px; font-size: 12px; }
  footer .links2 a:hover { color: var(--foam); }
  footer .copy { margin-top: 22px; font-size: 10px; letter-spacing: .3em; text-transform: uppercase; }
  @media (max-width: 760px) { .grid { grid-template-columns: 1fr; } .nav { padding: 18px 24px; } .nav .links a { margin-left: 14px; font-size: 9px; } .top { padding: 150px 24px 40px; } .grid { padding: 30px 24px 100px; } }
