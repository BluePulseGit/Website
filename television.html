  .nav .links a { color:var(--stone); text-decoration:none; margin-left:28px; transition:color .5s; }
  .nav .links a:hover, .nav .links a.on { color:var(--foam); }
  .top { padding:190px 48px 40px; max-width:1200px; margin:0 auto; text-align:center; }
  .top .eyebrow { font-size:10.5px; letter-spacing:.5em; text-transform:uppercase; color:var(--glow); font-weight:500; margin-bottom:22px; }
  .top h1 { font-family:var(--display); font-weight:200; font-size:clamp(48px,8vw,110px); letter-spacing:-.03em; line-height:.95; color:var(--foam); }
  .top p { margin:24px auto 0; font-family:var(--display); font-style:italic; font-size:clamp(17px,1.8vw,22px); color:var(--stone); max-width:640px; line-height:1.5; }
  .wrap { max-width:1200px; margin:0 auto; padding:10px 48px 120px; }
  footer { padding:96px 48px 56px; background:var(--abyss); color:var(--stone); border-top:1px solid var(--hair); }
